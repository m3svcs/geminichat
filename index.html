<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      height: 100%;
      overflow: auto;
      touch-action: auto;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      min-height: 100%;
      overflow: auto;
      touch-action: auto;
      -webkit-overflow-scrolling: touch;
    }

    .app {
      display: flex;
      flex-direction: column;
      max-width: 800px;
      margin: 0 auto;
      min-height: 100%;
    }

    .header {
      padding: 10px 14px;
      background: #1a1a24;
      border-bottom: 1px solid #2e2e3e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 44px;
    }
    .header h1 { font-size: 16px; white-space: nowrap; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; flex-shrink: 0;
    }
    .status-dot.busy { background: #f59e0b; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-label { font-size: 12px; color: #a1a1aa; white-space: nowrap; }
    .status-label.busy { color: #f59e0b; }
    .btn-clear {
      background: transparent; border: 1px solid #2e2e3e;
      color: #a1a1aa; padding: 5px 10px; border-radius: 6px;
      cursor: pointer; font-size: 12px;
    }
    .btn-clear:active { background: #2e2e3e; }

    .config {
      padding: 8px 14px;
      background: #252536;
      border-bottom: 1px solid #2e2e3e;
      display: flex; flex-wrap: wrap; gap: 8px;
      align-items: center; flex-shrink: 0;
    }
    .url-row {
      display: flex; gap: 6px; flex: 1;
      min-width: 0; align-items: center;
    }
    .url-row label {
      font-size: 11px; color: #71717a;
      font-weight: bold; white-space: nowrap;
    }
    .url-row input[type="text"] {
      background: #0f0f13; border: 1px solid #2e2e3e;
      color: #e4e4e7; padding: 7px 8px; border-radius: 6px;
      font-size: 12px; font-family: monospace;
      flex: 1; min-width: 0;
    }
    .url-row input[type="text"]:focus { outline: none; border-color: #6366f1; }
    .chk-wrap {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: #a1a1aa; cursor: pointer; white-space: nowrap;
    }
    .chk-wrap input[type="checkbox"] { accent-color: #6366f1; width: 15px; height: 15px; }

    .chat {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
      -webkit-overflow-scrolling: touch; min-height: 0;
    }

    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 8px; padding: 16px;
    }
    .welcome .ic { font-size: 32px; opacity: 0.5; }
    .welcome h2 { font-size: 17px; }
    .welcome p { color: #71717a; font-size: 13px; max-width: 300px; line-height: 1.4; }
    .qbtns {
      display: flex; flex-wrap: wrap; gap: 6px;
      justify-content: center; margin-top: 8px;
    }
    .qbtns button {
      background: #252536; border: 1px solid #2e2e3e; color: #a1a1aa;
      padding: 7px 12px; border-radius: 14px; font-size: 12px; cursor: pointer;
    }
    .qbtns button:active { background: #2e2e3e; }

    .m { display: flex; gap: 8px; max-width: 90%; animation: fi 0.2s ease; }
    @keyframes fi { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    .m.u { align-self: flex-end; flex-direction: row-reverse; }
    .m .av {
      width: 26px; height: 26px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; flex-shrink: 0;
    }
    .m.u .av { background: #2d5aa0; }
    .m.b .av { background: linear-gradient(135deg, #6366f1, #a855f7); }
    .m .bb {
      padding: 9px 11px; border-radius: 10px;
      font-size: 14px; line-height: 1.5;
      word-wrap: break-word; overflow-wrap: break-word;
    }
    .m.u .bb { background: #2d5aa0; border-bottom-right-radius: 3px; }
    .m.b .bb { background: #1e1e2e; border: 1px solid #2e2e3e; border-bottom-left-radius: 3px; }

    .bb p { margin-bottom: 5px; }
    .bb p:last-child { margin-bottom: 0; }
    .bb pre {
      background: #0d0d14; border: 1px solid #2e2e3e;
      border-radius: 6px; padding: 8px; overflow-x: auto; margin: 5px 0;
    }
    .bb code { font-family: monospace; font-size: 12px; }
    .bb p code, .bb li code { background: rgba(99,102,241,0.15); padding: 1px 4px; border-radius: 3px; }
    .bb pre code { background: none; padding: 0; }
    .bb strong { color: #f4f4f5; }
    .bb em { color: #a1a1aa; }
    .bb ul, .bb ol { padding-left: 16px; margin: 4px 0; }
    .bb li { margin-bottom: 2px; }
    .bb blockquote { border-left: 3px solid #6366f1; padding-left: 8px; margin: 4px 0; color: #a1a1aa; }
    .bb h1,.bb h2,.bb h3 { margin: 6px 0 3px; }
    .bb h1 { font-size: 16px; } .bb h2 { font-size: 15px; } .bb h3 { font-size: 14px; }
    .cb {
      display: flex; justify-content: space-between; background: #252536;
      padding: 4px 8px; border-radius: 6px 6px 0 0; margin-top: 5px;
      font-size: 11px; color: #71717a; font-family: monospace;
    }
    .cb + pre { margin-top: 0; border-top-left-radius: 0; border-top-right-radius: 0; }
    .cb button { background: none; border: none; color: #71717a; cursor: pointer; font-size: 11px; }

    .tp { display: flex; gap: 4px; padding: 5px 0; }
    .tp span {
      width: 6px; height: 6px; border-radius: 50%; background: #71717a;
      animation: bn 1.4s ease-in-out infinite;
    }
    .tp span:nth-child(2) { animation-delay: 0.2s; }
    .tp span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bn { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-5px);opacity:1} }

    .ibar {
      padding: 8px 14px; background: #1a1a24;
      border-top: 1px solid #2e2e3e; flex-shrink: 0;
    }
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .ibar { padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
    }
    .irow {
      display: flex; gap: 8px; background: #0f0f13;
      border: 1px solid #2e2e3e; border-radius: 10px;
      padding: 6px 10px; align-items: flex-end;
    }
    .irow:focus-within { border-color: #6366f1; }
    .irow textarea {
      flex: 1; background: none; border: none; color: #e4e4e7;
      font-family: inherit; font-size: 16px;
      resize: none; min-height: 24px; max-height: 80px;
      line-height: 1.4; padding: 2px 0;
    }
    .irow textarea:focus { outline: none; }
    .irow textarea::placeholder { color: #71717a; }
    .sbtn {
      width: 36px; height: 36px; background: #6366f1; border: none;
      border-radius: 8px; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sbtn:active { background: #818cf8; }
    .sbtn:disabled { opacity: 0.3; }
    .sbtn svg { width: 16px; height: 16px; }

    .toast {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      padding: 8px 16px; border-radius: 8px; font-size: 13px;
      z-index: 999; animation: si 0.2s ease;
      max-width: 90vw; text-align: center;
    }
    .toast.er { background: #1a0505; border: 1px solid #ef4444; color: #ef4444; }
    .toast.ok { background: #051a0a; border: 1px solid #22c55e; color: #22c55e; }
    @keyframes si { from{opacity:0;transform:translateX(-50%) translateY(-8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

    /* BIBLE REFERENCE STYLES */
    .bible-ref {
      text-decoration: underline;
      text-decoration-color: #6366f1;
      text-underline-offset: 3px;
      text-decoration-thickness: 2px;
      color: #a5b4fc;
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
    }
    .bible-ref:hover { color: #c7d2fe; }

    .bible-popup {
      position: fixed;
      z-index: 10000;
      background: #1e1e2e;
      border: 1px solid #6366f1;
      border-radius: 10px;
      padding: 14px 16px;
      max-width: 380px;
      min-width: 240px;
      max-height: 320px;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      font-size: 13px;
      line-height: 1.6;
      color: #e4e4e7;
      pointer-events: auto;
      animation: popIn 0.15s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .bible-popup-title {
      font-weight: 700; font-size: 14px; color: #a5b4fc;
      margin-bottom: 8px; padding-bottom: 6px;
      border-bottom: 1px solid #2e2e3e;
    }
    .bible-popup-text { color: #d4d4d8; font-size: 13px; line-height: 1.65; }
    .bible-popup-text .verse-num {
      color: #6366f1; font-weight: 700; font-size: 11px;
      vertical-align: super; margin-right: 2px;
    }
    .bible-popup-loading { color: #71717a; font-style: italic; }
    .bible-popup-error { color: #f87171; font-size: 12px; }
    .bible-popup-footer {
      margin-top: 8px; padding-top: 6px;
      border-top: 1px solid #2e2e3e;
      font-size: 10px; color: #52525b; text-align: right;
    }

    @media (max-width: 500px) {
      .bible-popup {
        max-width: calc(100vw - 32px);
        left: 16px !important;
        right: 16px !important;
      }
    }
  </style>
</head>
<body>

<div class="app" id="app">

  <div class="header">
    <h1>✦ Gemini Chat</h1>
    <div class="header-right">
      <div class="status-dot" id="sDot"></div>
      <span class="status-label" id="sLabel">Connected</span>
      <button class="btn-clear" id="bClr">Clear</button>
    </div>
  </div>

  <div class="config">
    <div class="url-row">
      <label>URL:</label>
      <input type="text" id="iUrl" value="https://old-tooth-d055.m3svcs.workers.dev";
        placeholder="https://old-tooth-d055.m3svcs.workers.dev"
        autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false">
    </div>
    <label class="chk-wrap">
      <input type="checkbox" id="cStr" checked> Stream
    </label>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="wel">
      <div class="ic">✦</div>
      <h2>Gemini Chat</h2>
      <p>Enter your Cloudflare Worker URL above, then type a message below.</p>
      <div class="qbtns" id="qbtns">
        <button data-q="Explain after life in simple terms">After Life Concepts</button>
        <button data-q="Is there a Supreme Being who created the universe?">Creation of the universe</button>
        <button data-q="How to be saved before death?">What is salvation?</button>
      </div>
    </div>
  </div>

  <div class="ibar" id="ibar">
    <div class="irow">
      <textarea id="iMsg" placeholder="Type a message..." rows="1"></textarea>
      <button class="sbtn" id="bSnd" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

</div>

<div class="bible-popup" id="biblePopup" style="display:none;"></div>

<script>
(function() {
  try {

    var msgs = [];
    var busy = false;
    var ac = null;
    var verseCache = {};

    var app = document.getElementById('app');
    var chat = document.getElementById('chat');
    var wel = document.getElementById('wel');
    var iMsg = document.getElementById('iMsg');
    var iUrl = document.getElementById('iUrl');
    var bSnd = document.getElementById('bSnd');
    var bClr = document.getElementById('bClr');
    var cStr = document.getElementById('cStr');
    var sDot = document.getElementById('sDot');
    var sLabel = document.getElementById('sLabel');
    var biblePopup = document.getElementById('biblePopup');

    // ==========================================
    // CLEAN RESPONSE
    // ==========================================
    function cleanResponse(text) {
      if (!text) return "";
      var trimmed = text.trim();
      if (trimmed.toLowerCase() === "no response." || trimmed.toLowerCase() === "no response") {
        return "No response.";
      }
      var cleaned = trimmed.replace(/[\s\n]*No response\.?\s*$/i, "");
      if (!cleaned.trim()) return trimmed;
      return cleaned.trim();
    }

    // ==========================================
    // BIBLE REFERENCE DETECTION
    // ==========================================
    var BOOK_NAMES = [
      "Genesis", "Gen", "Ge",
      "Exodus", "Exod", "Ex",
      "Leviticus", "Lev", "Le",
      "Numbers", "Num", "Nu",
      "Deuteronomy", "Deut", "Dt",
      "Joshua", "Josh", "Jos",
      "Judges", "Judg", "Jdg",
      "Ruth", "Ru",
      "1 Samuel", "1Sam", "1 Sam", "1Sa",
      "2 Samuel", "2Sam", "2 Sam", "2Sa",
      "1 Kings", "1Kgs", "1 Kgs", "1Ki",
      "2 Kings", "2Kgs", "2 Kgs", "2Ki",
      "1 Chronicles", "1Chr", "1 Chr", "1Ch",
      "2 Chronicles", "2Chr", "2 Chr", "2Ch",
      "Ezra", "Ezr",
      "Nehemiah", "Neh", "Ne",
      "Esther", "Est", "Es",
      "Job", "Jb",
      "Psalms", "Psalm", "Ps", "Psa",
      "Proverbs", "Prov", "Pr",
      "Ecclesiastes", "Eccl", "Ecc", "Ec",
      "Song of Solomon", "Song", "SoS", "SS",
      "Isaiah", "Isa", "Is",
      "Jeremiah", "Jer", "Je",
      "Lamentations", "Lam", "La",
      "Ezekiel", "Ezek", "Eze",
      "Daniel", "Dan", "Da",
      "Hosea", "Hos", "Ho",
      "Joel", "Joe",
      "Amos", "Am",
      "Obadiah", "Obad", "Ob",
      "Jonah", "Jon",
      "Micah", "Mic", "Mi",
      "Nahum", "Nah", "Na",
      "Habakkuk", "Hab",
      "Zephaniah", "Zeph", "Zep",
      "Haggai", "Hag", "Hg",
      "Zechariah", "Zech", "Zec",
      "Malachi", "Mal",
      "Matthew", "Matt", "Mt",
      "Mark", "Mk",
      "Luke", "Lk",
      "John", "Jn",
      "Acts", "Ac",
      "Romans", "Rom", "Ro",
      "1 Corinthians", "1Cor", "1 Cor", "1Co",
      "2 Corinthians", "2Cor", "2 Cor", "2Co",
      "Galatians", "Gal", "Ga",
      "Ephesians", "Eph",
      "Philippians", "Phil", "Php",
      "Colossians", "Col",
      "1 Thessalonians", "1Thess", "1 Thess", "1Th",
      "2 Thessalonians", "2Thess", "2 Thess", "2Th",
      "1 Timothy", "1Tim", "1 Tim", "1Ti",
      "2 Timothy", "2Tim", "2 Tim", "2Ti",
      "Titus", "Tit",
      "Philemon", "Phlm", "Phm",
      "Hebrews", "Heb",
      "James", "Jas", "Jm",
      "1 Peter", "1Pet", "1 Pet", "1Pe",
      "2 Peter", "2Pet", "2 Pet", "2Pe",
      "1 John", "1Jn", "1 Jn",
      "2 John", "2Jn", "2 Jn",
      "3 John", "3Jn", "3 Jn",
      "Jude", "Jud",
      "Revelation", "Rev", "Re"
    ];

    BOOK_NAMES.sort(function(a, b) { return b.length - a.length; });

    var booksPattern = BOOK_NAMES.map(function(b) {
      return b.replace(/\s/g, "\\s+");
    }).join("|");

    var BIBLE_REGEX = new RegExp(
      "(?:" + booksPattern + ")" +
      "\\.?" +
      "\\s+" +
      "\\d+" +
      "(?:" +
        ":\\d+" +
        "(?:\\s*[-\u2013\u2014]\\s*\\d+)?" +
        "(?:\\s*,\\s*\\d+" +
          "(?:\\s*[-\u2013\u2014]\\s*\\d+)?" +
        ")*" +
      ")?",
      "gi"
    );

    function addBibleLinks(html) {
      var parts = html.split(/(<[^>]+>)/);
      var inCode = false;
      for (var i = 0; i < parts.length; i++) {
        var part = parts[i];
        if (part.indexOf("<pre") === 0 || part.indexOf("<code") === 0) inCode = true;
        if (part.indexOf("</pre") === 0 || part.indexOf("</code") === 0) inCode = false;
        if (part.charAt(0) === "<" || inCode) continue;
        parts[i] = part.replace(BIBLE_REGEX, function(match) {
          var ref = match.trim();
          var encoded = ref.replace(/"/g, "&quot;");
          return '<span class="bible-ref" data-ref="' + encoded + '">' + ref + '</span>';
        });
      }
      return parts.join("");
    }

    // ==========================================
    // BIBLE POPUP
    // ==========================================
    var popupTimer = null;
    var currentRef = null;
    var isOverPopup = false;
    var isOverRef = false;

    function fetchVerse(reference, callback) {
      if (verseCache[reference]) {
        callback(null, verseCache[reference]);
        return;
      }
      var encoded = encodeURIComponent(reference);
      var url = "https://bible-api.com/" + encoded + "?translation=web";
      fetch(url)
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function(data) {
          var result = {
            reference: data.reference || reference,
            text: "",
            verses: []
          };
          if (data.verses && data.verses.length > 0) {
            for (var i = 0; i < data.verses.length; i++) {
              var v = data.verses[i];
              result.verses.push({ verse: v.verse, text: v.text.trim() });
            }
          } else if (data.text) {
            result.text = data.text.trim();
          }
          verseCache[reference] = result;
          callback(null, result);
        })
        .catch(function(err) { callback(err, null); });
    }

    function showPopup(refEl) {
      var reference = refEl.getAttribute("data-ref");
      if (!reference) return;
      currentRef = reference;
      isOverRef = true;

      var rect = refEl.getBoundingClientRect();
      var popupWidth = 360;
      var viewW = window.innerWidth;
      var viewH = window.innerHeight;

      biblePopup.innerHTML =
        '<div class="bible-popup-title">\uD83D\uDCD6 ' + esc(reference) + '</div>' +
        '<div class="bible-popup-loading">Loading verse text...</div>';
      biblePopup.style.display = "block";

      var left = rect.left;
      var top = rect.bottom + 8;
      if (left + popupWidth > viewW - 16) left = viewW - popupWidth - 16;
      if (left < 16) left = 16;
      if (top + 200 > viewH) {
        top = rect.top - 8;
        biblePopup.style.top = "auto";
        biblePopup.style.bottom = (viewH - top) + "px";
      } else {
        biblePopup.style.top = top + "px";
        biblePopup.style.bottom = "auto";
      }
      biblePopup.style.left = left + "px";

      fetchVerse(reference, function(err, data) {
        if (currentRef !== reference) return;
        if (err) {
          biblePopup.innerHTML =
            '<div class="bible-popup-title">\uD83D\uDCD6 ' + esc(reference) + '</div>' +
            '<div class="bible-popup-error">Could not load verse.</div>' +
            '<div class="bible-popup-footer">Bible</div>';
          return;
        }
        var h = '<div class="bible-popup-title">\uD83D\uDCD6 ' + esc(data.reference) + '</div>';
        h += '<div class="bible-popup-text">';
        if (data.verses && data.verses.length > 0) {
          for (var i = 0; i < data.verses.length; i++) {
            var v = data.verses[i];
            h += '<span class="verse-num">' + v.verse + '</span>';
            h += esc(v.text) + " ";
          }
        } else if (data.text) {
          h += esc(data.text);
        } else {
          h += '<span class="bible-popup-error">No text found.</span>';
        }
        h += '</div>';
        h += '<div class="bible-popup-footer">World English Bible (WEB)</div>';
        biblePopup.innerHTML = h;
      });
    }

    function hidePopup() {
      isOverRef = false;
      clearTimeout(popupTimer);
      popupTimer = setTimeout(function() {
        if (!isOverRef && !isOverPopup) {
          biblePopup.style.display = "none";
          currentRef = null;
        }
      }, 200);
    }

    biblePopup.addEventListener("mouseenter", function() {
      isOverPopup = true;
      clearTimeout(popupTimer);
    });
    biblePopup.addEventListener("mouseleave", function() {
      isOverPopup = false;
      hidePopup();
    });
    biblePopup.addEventListener("touchstart", function(e) { e.stopPropagation(); });

    document.addEventListener("mouseover", function(e) {
      var ref = null;
      var el = e.target;
      while (el && el !== document.body) {
        if (el.className && el.className.indexOf("bible-ref") !== -1) { ref = el; break; }
        el = el.parentNode;
      }
      if (ref) { clearTimeout(popupTimer); showPopup(ref); }
    });

    document.addEventListener("mouseout", function(e) {
      if (e.target.className && e.target.className.indexOf("bible-ref") !== -1) hidePopup();
    });

    document.addEventListener("click", function(e) {
      var ref = null;
      var el = e.target;
      while (el && el !== document.body) {
        if (el.className && el.className.indexOf("bible-ref") !== -1) { ref = el; break; }
        el = el.parentNode;
      }
      if (ref) {
        e.preventDefault();
        if (biblePopup.style.display === "block" && currentRef === ref.getAttribute("data-ref")) {
          biblePopup.style.display = "none";
          currentRef = null;
        } else {
          showPopup(ref);
        }
      } else if (!biblePopup.contains(e.target)) {
        biblePopup.style.display = "none";
        currentRef = null;
      }
    });

    // ==========================================
    // APP LOGIC
    // ==========================================
    function setH() { app.style.height = window.innerHeight + "px"; }
    setH();
    window.addEventListener("resize", setH);

    iUrl.value = ls("gc_u") || "";
    var sm = [];
    try {
      var raw = ls("gc_m");
      if (raw) { var p = JSON.parse(raw); if (Array.isArray(p)) sm = p; }
    } catch(e) {}
    if (sm.length > 0) {
      msgs = sm;
      wel.style.display = "none";
      for (var i = 0; i < msgs.length; i++) addMsg(msgs[i].role, msgs[i].content);
      sd();
    }

    function ls(k, v) {
      try {
        if (v === undefined) return localStorage.getItem(k);
        localStorage.setItem(k, v);
      } catch(e) { return null; }
    }

    function cleanUrl(url) {
      if (!url) return "";
      url = url.trim().replace(/\/+$/, "");
      if (url && url.indexOf("http://") !== 0 && url.indexOf("https://") !== 0) url = "https://" + url;
      return url;
    }

    function setStatus(v) {
      busy = v;
      bSnd.disabled = v;
      if (v) {
        sDot.className = "status-dot busy";
        sLabel.className = "status-label busy";
        sLabel.textContent = "Thinking...";
      } else {
        sDot.className = "status-dot";
        sLabel.className = "status-label";
        sLabel.textContent = "Connected";
      }
    }

    iUrl.addEventListener("input", function() { ls("gc_u", iUrl.value.trim()); });
    iUrl.addEventListener("blur", function() { ls("gc_u", iUrl.value.trim()); });

    bClr.addEventListener("click", function() {
      msgs = [];
      try { localStorage.removeItem("gc_m"); } catch(e) {}
      var all = chat.querySelectorAll(".m");
      for (var i = 0; i < all.length; i++) all[i].remove();
      wel.style.display = "";
      if (ac) { ac.abort(); ac = null; }
      setStatus(false);
    });

    document.getElementById("qbtns").addEventListener("click", function(e) {
      var t = e.target;
      if (t.tagName === "BUTTON" && t.getAttribute("data-q")) {
        iMsg.value = t.getAttribute("data-q");
        send();
      }
    });

    bSnd.addEventListener("click", function(e) { e.preventDefault(); send(); });

    iMsg.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    iMsg.addEventListener("input", function() {
      iMsg.style.height = "auto";
      iMsg.style.height = Math.min(iMsg.scrollHeight, 80) + "px";
    });

    iMsg.addEventListener("focus", function() {
      setTimeout(function() { setH(); sd(); }, 300);
    });
    iMsg.addEventListener("blur", function() { setTimeout(setH, 100); });

    function send() {
      var text = iMsg.value.trim();
      if (!text || busy) return;
      var rawUrl = iUrl.value.trim();
      rawUrl = "https://old-tooth-d055.m3svcs.workers.dev"
      if (!rawUrl) { toast("Enter Worker URL first", "er"); iUrl.focus(); return; }
      var url = cleanUrl(rawUrl);
      ls("gc_u", rawUrl);
      wel.style.display = "none";
      msgs.push({ role: "user", content: text });
      addMsg("user", text);
      saveM();
      iMsg.value = "";
      iMsg.style.height = "auto";
      sd();
      setStatus(true);
      var body = { messages: msgs, stream: cStr.checked };
      if (cStr.checked) runStream(url, body);
      else runNormal(url, body);
    }

    function runNormal(url, payload) {
      ac = new AbortController();
      var typ = mkTyping();
      chat.appendChild(typ); sd();
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        signal: ac.signal
      })
      .then(function(r) {
        if (typ.parentNode) typ.remove();
        if (!r.ok) return r.text().then(function(t) { throw new Error("HTTP " + r.status + ": " + t.substring(0, 200)); });
        return r.json();
      })
      .then(function(d) {
        var text = (d && d.response) ? d.response : "";
        text = cleanResponse(text);
        msgs.push({ role: "assistant", content: text });
        addMsg("assistant", text);
        saveM(); sd(); setStatus(false);
      })
      .catch(function(e) {
        if (typ.parentNode) typ.remove();
        if (e.name !== "AbortError") toast(e.message, "er");
        setStatus(false);
      });
    }

    function runStream(url, payload) {
      ac = new AbortController();
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        signal: ac.signal
      })
      .then(function(r) {
        if (!r.ok) return r.text().then(function(t) { throw new Error("HTTP " + r.status + ": " + t.substring(0, 200)); });
        if (r.body && typeof r.body.getReader === "function") return useReader(r);
        return useFallback(r);
      })
      .catch(function(e) {
        if (e.name !== "AbortError") toast(e.message, "er");
        setStatus(false);
      });
    }

    function useReader(r) {
      var el = document.createElement("div");
      el.className = "m b";
      el.innerHTML = '<div class="av">\u2726</div><div class="bb"><span style="opacity:0.5">\u2588</span></div>';
      chat.appendChild(el);
      var bbl = el.querySelector(".bb");
      var full = "";
      var reader = r.body.getReader();
      var decoder = new TextDecoder("utf-8");
      var buf = "";
      function pump() {
        return reader.read().then(function(res) {
          if (res.done) {
            full = cleanResponse(full);
            bbl.innerHTML = addBibleLinks(md(full));
            msgs.push({ role: "assistant", content: full });
            saveM(); sd(); setStatus(false);
            return;
          }
          buf += decoder.decode(res.value, { stream: true });
          var lines = buf.split("\n");
          buf = lines.pop() || "";
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.indexOf("data: ") === 0) {
              var p = line.substring(6).trim();
              if (p === "[DONE]") continue;
              try {
                var j = JSON.parse(p);
                if (j.text) {
                  full += j.text;
                  bbl.innerHTML = md(full) + '<span style="opacity:0.5">\u2588</span>';
                  sd();
                }
              } catch(e) {}
            }
          }
          return pump();
        });
      }
      return pump();
    }

    function useFallback(r) {
      return r.text().then(function(text) {
        var full = "";
        var lines = text.split("\n");
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.indexOf("data: ") === 0) {
            var p = line.substring(6).trim();
            if (p === "[DONE]") continue;
            try { var j = JSON.parse(p); if (j.text) full += j.text; } catch(e) {}
          }
        }
        full = cleanResponse(full);
        if (full) {
          msgs.push({ role: "assistant", content: full });
          addMsg("assistant", full); saveM(); sd();
        }
        setStatus(false);
      });
    }

    function addMsg(role, content) {
      var el = document.createElement("div");
      el.className = "m " + (role === "user" ? "u" : "b");
      var av = (role === "user") ? "\uD83D\uDC64" : "\u2726";
      var html = (role === "user") ? esc(content) : addBibleLinks(md(content));
      el.innerHTML = '<div class="av">' + av + '</div><div class="bb">' + html + '</div>';
      chat.appendChild(el);
    }

    function mkTyping() {
      var el = document.createElement("div");
      el.className = "m b";
      el.innerHTML = '<div class="av">\u2726</div><div class="bb"><div class="tp"><span></span><span></span><span></span></div></div>';
      return el;
    }

    function sd() { setTimeout(function() { chat.scrollTop = chat.scrollHeight; }, 60); }
    function saveM() { try { ls("gc_m", JSON.stringify(msgs.slice(-50))); } catch(e) {} }

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function md(text) {
      if (!text) return "";
      var h = text;
      h = h.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
        var l = lang || "code";
        var id = "c" + Math.random().toString(36).substr(2, 5);
        return '<div class="cb"><span>' + l + '</span><button onclick="window._cc(\'' + id + "',this)\">Copy</button></div><pre id=\"" + id + '"><code>' + esc(code.trim()) + "</code></pre>";
      });
      h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
      h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      h = h.replace(/\*(.+?)\*/g, "<em>$1</em>");
      h = h.replace(/^### (.+)$/gm, "<h3>$1</h3>");
      h = h.replace(/^## (.+)$/gm, "<h2>$1</h2>");
      h = h.replace(/^# (.+)$/gm, "<h1>$1</h1>");
      h = h.replace(/^> (.+)$/gm, "<blockquote>$1</blockquote>");
      h = h.replace(/^[\-\*] (.+)$/gm, "<li>$1</li>");
      h = h.replace(/((?:<li>[\s\S]*?<\/li>\s*)+)/g, "<ul>$1</ul>");
      h = h.replace(/\n\n/g, "</p><p>");
      h = h.replace(/\n/g, "<br>");
      if (h.charAt(0) !== "<") h = "<p>" + h + "</p>";
      h = h.replace(/<p>\s*<\/p>/g, "");
      return h;
    }

    window._cc = function(id, btn) {
      var el = document.getElementById(id);
      if (!el) return;
      var text = el.textContent;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function() {
          btn.textContent = "Copied!";
          setTimeout(function() { btn.textContent = "Copy"; }, 1500);
        }).catch(function() { fbCopy(text, btn); });
      } else { fbCopy(text, btn); }
    };

    function fbCopy(text, btn) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px"; ta.style.top = "-9999px";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand("copy"); btn.textContent = "Copied!"; }
      catch(e) { btn.textContent = "Failed"; }
      document.body.removeChild(ta);
      setTimeout(function() { btn.textContent = "Copy"; }, 1500);
    }

    function toast(msg, type) {
      var el = document.createElement("div");
      el.className = "toast " + (type === "ok" ? "ok" : "er");
      el.textContent = (type === "ok" ? "\u2713 " : "\u26A0 ") + msg;
      document.body.appendChild(el);
      setTimeout(function() {
        el.style.opacity = "0"; el.style.transition = "opacity 0.3s";
        setTimeout(function() { if (el.parentNode) el.remove(); }, 300);
      }, 3000);
    }

  } catch(err) {
    document.body.innerHTML =
      '<div style="padding:20px;color:#ef4444;font-family:monospace;font-size:13px;">' +
      "<h3>Error</h3><pre style=\"margin-top:10px;white-space:pre-wrap;background:#1a1a24;" +
      'padding:12px;border-radius:6px;color:#e4e4e7;">' +
      err.message + "\n\n" + err.stack + "</pre></div>";
  }
})();
</script>
</body>
</html>
