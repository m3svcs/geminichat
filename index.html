<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gemini Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 800px;
      margin: 0 auto;
      overflow: hidden;
      /* Critical: use fixed position layout */
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Centering for desktop */
    @media (min-width: 801px) {
      body {
        left: 50%;
        transform: translateX(-50%);
        width: 800px;
      }
    }

    /* HEADER */
    .header {
      padding: 10px 14px;
      background: #1a1a24;
      border-bottom: 1px solid #2e2e3e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 44px;
    }
    .header h1 { font-size: 16px; white-space: nowrap; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .status-dot.busy {
      background: #f59e0b;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-label {
      font-size: 12px;
      color: #a1a1aa;
      white-space: nowrap;
    }
    .status-label.busy { color: #f59e0b; }
    .btn-clear {
      background: transparent;
      border: 1px solid #2e2e3e;
      color: #a1a1aa;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-clear:active { background: #2e2e3e; }

    /* CONFIG */
    .config {
      padding: 8px 14px;
      background: #252536;
      border-bottom: 1px solid #2e2e3e;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .url-row {
      display: flex;
      gap: 6px;
      flex: 1;
      min-width: 0;
      align-items: center;
    }
    .url-row label {
      font-size: 11px;
      color: #71717a;
      font-weight: bold;
      white-space: nowrap;
    }
    .url-row input[type="text"] {
      background: #0f0f13;
      border: 1px solid #2e2e3e;
      color: #e4e4e7;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      flex: 1;
      min-width: 0;
      -webkit-appearance: none;
    }
    .url-row input[type="text"]:focus { outline: none; border-color: #6366f1; }
    .chk-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #a1a1aa;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .chk-wrap input[type="checkbox"] {
      accent-color: #6366f1;
      width: 15px;
      height: 15px;
    }

    /* CHAT */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      min-height: 0; /* critical for flex shrink */
    }

    /* WELCOME */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      padding: 16px;
    }
    .welcome .ic { font-size: 32px; opacity: 0.5; }
    .welcome h2 { font-size: 17px; }
    .welcome p {
      color: #71717a;
      font-size: 13px;
      max-width: 300px;
      line-height: 1.4;
    }
    .qbtns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }
    .qbtns button {
      background: #252536;
      border: 1px solid #2e2e3e;
      color: #a1a1aa;
      padding: 7px 12px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .qbtns button:active { background: #2e2e3e; }

    /* MESSAGES */
    .m {
      display: flex;
      gap: 8px;
      max-width: 90%;
      animation: fi 0.2s ease;
    }
    @keyframes fi {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .m.u { align-self: flex-end; flex-direction: row-reverse; }
    .m .av {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
    }
    .m.u .av { background: #2d5aa0; }
    .m.b .av { background: linear-gradient(135deg, #6366f1, #a855f7); }
    .m .bb {
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .m.u .bb { background: #2d5aa0; border-bottom-right-radius: 3px; }
    .m.b .bb {
      background: #1e1e2e;
      border: 1px solid #2e2e3e;
      border-bottom-left-radius: 3px;
    }

    /* Markdown */
    .bb p { margin-bottom: 5px; }
    .bb p:last-child { margin-bottom: 0; }
    .bb pre {
      background: #0d0d14;
      border: 1px solid #2e2e3e;
      border-radius: 6px;
      padding: 8px;
      overflow-x: auto;
      margin: 5px 0;
      -webkit-overflow-scrolling: touch;
    }
    .bb code { font-family: monospace; font-size: 12px; }
    .bb p code, .bb li code {
      background: rgba(99,102,241,0.15);
      padding: 1px 4px;
      border-radius: 3px;
    }
    .bb pre code { background: none; padding: 0; }
    .bb strong { color: #f4f4f5; }
    .bb em { color: #a1a1aa; }
    .bb ul, .bb ol { padding-left: 16px; margin: 4px 0; }
    .bb li { margin-bottom: 2px; }
    .bb blockquote {
      border-left: 3px solid #6366f1;
      padding-left: 8px;
      margin: 4px 0;
      color: #a1a1aa;
    }
    .bb h1,.bb h2,.bb h3 { margin: 6px 0 3px; }
    .bb h1 { font-size: 16px; }
    .bb h2 { font-size: 15px; }
    .bb h3 { font-size: 14px; }

    .cb {
      display: flex;
      justify-content: space-between;
      background: #252536;
      padding: 4px 8px;
      border-radius: 6px 6px 0 0;
      margin-top: 5px;
      font-size: 11px;
      color: #71717a;
      font-family: monospace;
    }
    .cb + pre {
      margin-top: 0;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }
    .cb button {
      background: none;
      border: none;
      color: #71717a;
      cursor: pointer;
      font-size: 11px;
    }

    /* Typing */
    .tp { display: flex; gap: 4px; padding: 5px 0; }
    .tp span {
      width: 6px; height: 6px; border-radius: 50%; background: #71717a;
      animation: bn 1.4s ease-in-out infinite;
    }
    .tp span:nth-child(2) { animation-delay: 0.2s; }
    .tp span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bn {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* INPUT BAR - pinned to bottom */
    .ibar {
      padding: 8px 14px;
      background: #1a1a24;
      border-top: 1px solid #2e2e3e;
      flex-shrink: 0;
      /* Safe area for phones with bottom gestures */
      padding-bottom: 8px;
    }
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .ibar {
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
      }
    }
    .irow {
      display: flex;
      gap: 8px;
      background: #0f0f13;
      border: 1px solid #2e2e3e;
      border-radius: 10px;
      padding: 6px 10px;
      align-items: flex-end;
    }
    .irow:focus-within { border-color: #6366f1; }
    .irow textarea {
      flex: 1;
      background: none;
      border: none;
      color: #e4e4e7;
      font-family: inherit;
      font-size: 16px; /* 16px prevents iOS zoom */
      resize: none;
      min-height: 24px;
      max-height: 80px;
      line-height: 1.4;
      -webkit-appearance: none;
      padding: 2px 0;
    }
    .irow textarea:focus { outline: none; }
    .irow textarea::placeholder { color: #71717a; }
    .sbtn {
      width: 36px;
      height: 36px;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .sbtn:active { background: #818cf8; }
    .sbtn:disabled { opacity: 0.3; }
    .sbtn svg { width: 16px; height: 16px; }

    /* Toast */
    .toast {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 999;
      animation: si 0.2s ease;
      max-width: 90vw;
      text-align: center;
    }
    .toast.er {
      background: #1a0505;
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .toast.ok {
      background: #051a0a;
      border: 1px solid #22c55e;
      color: #22c55e;
    }
    @keyframes si {
      from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <h1>✦ Gemini Chat</h1>
    <div class="header-right">
      <div class="status-dot" id="sDot"></div>
      <span class="status-label" id="sLabel">Connected</span>
      <button class="btn-clear" id="bClr">Clear</button>
    </div>
  </div>

  <!-- CONFIG -->
  <div class="config">
    <div class="url-row">
      <label>URL:</label>
      <input type="text" id="iUrl"
        placeholder="https://old-tooth-d055.m3svcs.workers.dev"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false">
    </div>
    <label class="chk-wrap">
      <input type="checkbox" id="cStr" checked> Stream
    </label>
  </div>

  <!-- CHAT -->
  <div class="chat" id="chat">
    <div class="welcome" id="wel">
      <div class="ic">✦</div>
      <h2>Gemini Chat</h2>
      <p>Enter your Cloudflare Worker URL above, then type a message below.</p>
      <div class="qbtns" id="qbtns">
        <button data-q="Hello! Who are you?">Say Hello</button>
        <button data-q="Write a quicksort in JavaScript">Quicksort</button>
        <button data-q="Brainstorm 3 app ideas">App Ideas</button>
      </div>
    </div>
  </div>

  <!-- INPUT BAR - always visible -->
  <div class="ibar" id="ibar">
    <div class="irow">
      <textarea id="iMsg" placeholder="Type a message..." rows="1"></textarea>
      <button class="sbtn" id="bSnd" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

<script>
(function() {
  try {

    var msgs = [];
    var busy = false;
    var ac = null;

    var chat = document.getElementById('chat');
    var wel = document.getElementById('wel');
    var iMsg = document.getElementById('iMsg');
    var iUrl = document.getElementById('iUrl');
    var bSnd = document.getElementById('bSnd');
    var bClr = document.getElementById('bClr');
    var cStr = document.getElementById('cStr');
    var sDot = document.getElementById('sDot');
    var sLabel = document.getElementById('sLabel');
    var ibar = document.getElementById('ibar');

    // Load
    iUrl.value = ls('gc_u') || '';
    var sm = [];
    try {
      var raw = ls('gc_m');
      if (raw) { var p = JSON.parse(raw); if (Array.isArray(p)) sm = p; }
    } catch(e) {}

    if (sm.length > 0) {
      msgs = sm;
      wel.style.display = 'none';
      for (var i = 0; i < msgs.length; i++) addMsg(msgs[i].role, msgs[i].content);
      sd();
    }

    function ls(k, v) {
      try {
        if (v === undefined) return localStorage.getItem(k);
        localStorage.setItem(k, v);
      } catch(e) { return null; }
    }

    function cleanUrl(url) {
      if (!url) return '';
      url = url.trim().replace(/\/+$/, '');
      if (url && url.indexOf('http://') !== 0 && url.indexOf('https://') !== 0) {
        url = 'https://' + url;
      }
      return url;
    }

    function setStatus(isBusy) {
      busy = isBusy;
      bSnd.disabled = isBusy;
      if (isBusy) {
        sDot.className = 'status-dot busy';
        sLabel.className = 'status-label busy';
        sLabel.textContent = 'Thinking...';
      } else {
        sDot.className = 'status-dot';
        sLabel.className = 'status-label';
        sLabel.textContent = 'Connected';
      }
    }

    // URL save
    iUrl.addEventListener('input', function() { ls('gc_u', iUrl.value.trim()); });
    iUrl.addEventListener('blur', function() { ls('gc_u', iUrl.value.trim()); });

    // Clear
    bClr.addEventListener('click', function() {
      msgs = [];
      try { localStorage.removeItem('gc_m'); } catch(e) {}
      var all = chat.querySelectorAll('.m');
      for (var i = 0; i < all.length; i++) all[i].remove();
      wel.style.display = '';
      if (ac) { ac.abort(); ac = null; }
      setStatus(false);
    });

    // Quick buttons
    document.getElementById('qbtns').addEventListener('click', function(e) {
      var t = e.target;
      if (t.tagName === 'BUTTON' && t.getAttribute('data-q')) {
        iMsg.value = t.getAttribute('data-q');
        send();
      }
    });

    // Send button - use touchend AND click for mobile reliability
    bSnd.addEventListener('click', function(e) {
      e.preventDefault();
      send();
    });

    bSnd.addEventListener('touchend', function(e) {
      e.preventDefault();
      send();
    });

    // Keyboard enter
    iMsg.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // Auto-resize
    iMsg.addEventListener('input', function() {
      iMsg.style.height = 'auto';
      iMsg.style.height = Math.min(iMsg.scrollHeight, 80) + 'px';
    });

    // ===== MOBILE KEYBOARD FIX =====
    // When virtual keyboard opens, resize the layout
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function() {
        adjustForKeyboard();
      });
      window.visualViewport.addEventListener('scroll', function() {
        adjustForKeyboard();
      });
    }

    // Also handle focus/blur on textarea
    iMsg.addEventListener('focus', function() {
      setTimeout(function() {
        adjustForKeyboard();
        sd();
      }, 300);
    });

    iMsg.addEventListener('blur', function() {
      setTimeout(function() {
        document.body.style.height = '100%';
        sd();
      }, 100);
    });

    function adjustForKeyboard() {
      if (window.visualViewport) {
        var vh = window.visualViewport.height;
        document.body.style.height = vh + 'px';
        sd();
      }
    }

    // Send
    function send() {
      var text = iMsg.value.trim();
      if (!text || busy) return;

//      var rawUrl = iUrl.value.trim();
var rawUrl = "https://old-tooth-d055.m3svcs.workers.dev";
      if (!rawUrl) {
        toast('Enter Worker URL first', 'er');
        iUrl.focus();
        return;
      }

      var url = cleanUrl(rawUrl);
      ls('gc_u', rawUrl);

      wel.style.display = 'none';
      msgs.push({ role: 'user', content: text });
      addMsg('user', text);
      saveM();

      iMsg.value = '';
      iMsg.style.height = 'auto';
      sd();
      setStatus(true);

      var body = { messages: msgs, stream: cStr.checked };

      if (cStr.checked) {
        runStream(url, body);
      } else {
        runNormal(url, body);
      }
    }

    function runNormal(url, payload) {
      ac = new AbortController();
      var typ = mkTyping();
      chat.appendChild(typ);
      sd();

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ac.signal
      })
      .then(function(r) {
        if (typ.parentNode) typ.remove();
        if (!r.ok) {
          return r.text().then(function(t) {
            throw new Error('HTTP ' + r.status + ': ' + t.substring(0, 200));
          });
        }
        return r.json();
      })
      .then(function(d) {
        var reply = (d && d.response) ? d.response : 'No response.';
        msgs.push({ role: 'assistant', content: reply });
        addMsg('assistant', reply);
        saveM();
        sd();
        setStatus(false);
      })
      .catch(function(e) {
        if (typ.parentNode) typ.remove();
        if (e.name !== 'AbortError') toast(e.message, 'er');
        setStatus(false);
      });
    }

    function runStream(url, payload) {
      ac = new AbortController();

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ac.signal
      })
      .then(function(r) {
        if (!r.ok) {
          return r.text().then(function(t) {
            throw new Error('HTTP ' + r.status + ': ' + t.substring(0, 200));
          });
        }
        if (r.body && typeof r.body.getReader === 'function') {
          return useReader(r);
        } else {
          return useFallback(r);
        }
      })
      .catch(function(e) {
        if (e.name !== 'AbortError') toast(e.message, 'er');
        setStatus(false);
      });
    }

    function useReader(r) {
      var el = document.createElement('div');
      el.className = 'm b';
      el.innerHTML = '<div class="av">✦</div><div class="bb"><span style="opacity:0.5">▊</span></div>';
      chat.appendChild(el);
      var bbl = el.querySelector('.bb');

      var full = '';
      var reader = r.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buf = '';

      function pump() {
        return reader.read().then(function(res) {
          if (res.done) {
            bbl.innerHTML = md(full);
            msgs.push({ role: 'assistant', content: full });
            saveM();
            sd();
            setStatus(false);
            return;
          }

          buf += decoder.decode(res.value, { stream: true });
          var lines = buf.split('\n');
          buf = lines.pop() || '';

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.indexOf('data: ') === 0) {
              var p = line.substring(6).trim();
              if (p === '[DONE]') continue;
              try {
                var j = JSON.parse(p);
                if (j.text) {
                  full += j.text;
                  bbl.innerHTML = md(full) + '<span style="opacity:0.5">▊</span>';
                  sd();
                }
              } catch(e) {}
            }
          }
          return pump();
        });
      }
      return pump();
    }

    function useFallback(r) {
      return r.text().then(function(text) {
        var full = '';
        var lines = text.split('\n');
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.indexOf('data: ') === 0) {
            var p = line.substring(6).trim();
            if (p === '[DONE]') continue;
            try {
              var j = JSON.parse(p);
              if (j.text) full += j.text;
            } catch(e) {}
          }
        }
        if (full) {
          msgs.push({ role: 'assistant', content: full });
          addMsg('assistant', full);
          saveM();
          sd();
        }
        setStatus(false);
      });
    }

    function addMsg(role, content) {
      var el = document.createElement('div');
      el.className = 'm ' + (role === 'user' ? 'u' : 'b');
      var av = (role === 'user') ? '👤' : '✦';
      var html = (role === 'user') ? esc(content) : md(content);
      el.innerHTML = '<div class="av">' + av + '</div><div class="bb">' + html + '</div>';
      chat.appendChild(el);
    }

    function mkTyping() {
      var el = document.createElement('div');
      el.className = 'm b';
      el.innerHTML = '<div class="av">✦</div><div class="bb"><div class="tp"><span></span><span></span><span></span></div></div>';
      return el;
    }

    function sd() {
      setTimeout(function() { chat.scrollTop = chat.scrollHeight; }, 60);
    }

    function saveM() {
      try { ls('gc_m', JSON.stringify(msgs.slice(-50))); } catch(e) {}
    }

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function md(text) {
      if (!text) return '';
      var h = text;

      h = h.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
        var l = lang || 'code';
        var id = 'c' + Math.random().toString(36).substr(2, 5);
        return '<div class="cb"><span>' + l + '</span><button onclick="window._cc(\'' + id + '\',this)">Copy</button></div><pre id="' + id + '"><code>' + esc(code.trim()) + '</code></pre>';
      });

      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
      h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
      h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      h = h.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
      h = h.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
      h = h.replace(/((?:<li>[\s\S]*?<\/li>\s*)+)/g, '<ul>$1</ul>');
      h = h.replace(/\n\n/g, '</p><p>');
      h = h.replace(/\n/g, '<br>');
      if (h.charAt(0) !== '<') h = '<p>' + h + '</p>';
      h = h.replace(/<p>\s*<\/p>/g, '');
      return h;
    }

    window._cc = function(id, btn) {
      var el = document.getElementById(id);
      if (!el) return;
      var text = el.textContent;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function() {
          btn.textContent = 'Copied!';
          setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
        }).catch(function() { fbCopy(text, btn); });
      } else {
        fbCopy(text, btn);
      }
    };

    function fbCopy(text, btn) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); btn.textContent = 'Copied!'; }
      catch(e) { btn.textContent = 'Failed'; }
      document.body.removeChild(ta);
      setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
    }

    function toast(msg, type) {
      var el = document.createElement('div');
      el.className = 'toast ' + (type === 'ok' ? 'ok' : 'er');
      el.textContent = (type === 'ok' ? '✓ ' : '⚠ ') + msg;
      document.body.appendChild(el);
      setTimeout(function() {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s';
        setTimeout(function() { if (el.parentNode) el.remove(); }, 300);
      }, 3000);
    }

  } catch(err) {
    document.body.innerHTML =
      '<div style="padding:20px;color:#ef4444;font-family:monospace;font-size:13px;">' +
      '<h3>Error</h3><pre style="margin-top:10px;white-space:pre-wrap;background:#1a1a24;padding:12px;border-radius:6px;color:#e4e4e7;">' +
      err.message + '\n\n' + err.stack + '</pre></div>';
  }
})();
</script>
</body>
</html>
